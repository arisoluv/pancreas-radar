name: Weekly radar

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC (6–7 am Baltimore)
  workflow_dispatch: {}     # "Run workflow" button for manual runs

permissions:
  contents: write   # commit docs/ and data/
  models: read      # free GitHub Models summaries via GITHUB_TOKEN

concurrency: radar

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, rank, summarize, publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}       # optional
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }} # optional
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}         # optional: overrides GITHUB_TOKEN for another provider
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.run
      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Radar: week ending $(date -u +%F)"
          git push
